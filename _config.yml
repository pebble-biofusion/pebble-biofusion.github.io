# Site settings
title: Pebble Summer School Portal
description: Teaching materials and research outputs from Pebble summer school programs
email: your-email@example.com
baseurl: ""
url: "https://pebble-biofusion.github.io"

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .gitignore
  - README.md
  - LICENSE

# Collections
collections:
  methods:
    output: true
    permalink: /methods/:path/
  workflows:
    output: true
    permalink: /workflows/:path/
  projects:
    output: true
    permalink: /summerschool/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "methods"
    values:
      layout: "method"
  - scope:
      path: ""
      type: "workflows"
    values:
      layout: "workflow"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
