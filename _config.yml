# Site settings
title: PEBBLE
description: Physics + Engineering + Biology + Biotechnology + Learning + Experience
email: your-email@example.com
baseurl: ""
url: "https://pebble-biofusion.github.io"

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .gitignore
  - _tools
  - README.md
  - LICENSE

# Collections
collections:
  projects:
    output: true
    permalink: /workshop/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  # Keep the Search Console token and the image files out of sitemap.xml.
  - scope:
      path: "google1a7c08d77619a6fb.html"
    values:
      sitemap: false
  - scope:
      path: "images"
    values:
      sitemap: false
  # workshop/2026/materials holds only redirect stubs for the pre-August-2026 URLs
  # of workshop/materials. Keep them out of sitemap.xml.
  - scope:
      path: "workshop/2026/materials"
    values:
      sitemap: false
