<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}"/>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background: #fff;
      font-size: 16px;
    }

    /* Header */
    .site-header {
      background: #fff;
      padding: 1.5rem 0;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem;
      gap: 1.5rem;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5rem;
    }

    .header-logos {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-shrink: 0;
    }

    .header-logos a {
      display: inline-block;
      line-height: 0;
    }

    .header-logos img {
      height: 42px;
      width: auto;
      display: block;
      transition: opacity 0.2s;
    }

    .header-logos a:hover img {
      opacity: 0.7;
    }

    .site-title {
      font-size: 1.15rem;
      font-weight: 400;
      color: #555;
      text-decoration: none;
      display: inline-flex;
      align-items: baseline;
      flex-wrap: wrap;
      line-height: 1.4;
    }

    .site-title:hover {
      color: #0066cc;
    }

    .site-title .title-acronym {
      font-weight: 700;
      color: #FF6C0C;
      margin-right: 0.3rem;
      white-space: nowrap;
    }

    .site-title .title-eq {
      margin: 0 0.3rem;
      font-weight: 400;
    }

    .site-title .cap {
      font-weight: 700;
      color: #FF6C0C;
    }

    .site-title .op {
      margin: 0 0.5rem;
      font-weight: 400;
      color: #555;
    }

    .header-nav {
      display: flex;
      gap: 1.5rem;
    }

    .header-nav a {
      color: #555;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .header-nav a:hover {
      color: #0066cc;
    }

    .workshop-nav {
      display: flex;
      gap: 2rem;
      margin-top: 0.75rem;
    }

    .workshop-nav a {
      color: #FF6C0C;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s;
      padding: 0.35rem 0;
      border-bottom: 2px solid transparent;
    }

    .workshop-nav a:hover {
      color: #e55a00;
      border-bottom-color: #FF6C0C;
    }

    /* Main Layout */
    .main-wrapper {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Main Content */
    .main-content {
      padding: 2rem 3rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .main-content h1 {
      font-size: 1.8rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      color: #333;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 1rem;
    }

    .main-content h2 {
      font-size: 1.4rem;
      font-weight: 500;
      margin-top: 2rem;
      margin-bottom: 1rem;
      color: #333;
    }

    .main-content h3 {
      font-size: 1.1rem;
      font-weight: 500;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      color: #444;
    }

    .main-content p {
      margin-bottom: 1rem;
      color: #333;
    }

    .main-content ul, .main-content ol {
      margin-bottom: 1rem;
      padding-left: 1.5rem;
    }

    .main-content li {
      margin-bottom: 0.5rem;
    }

    .main-content a {
      color: #0066cc;
      text-decoration: none;
    }

    .main-content a:hover {
      text-decoration: underline;
    }

    .main-content code {
      background: #f4f4f4;
      padding: 0.2rem 0.4rem;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
    }

    .main-content pre {
      background: #f4f4f4;
      padding: 1rem;
      border-radius: 4px;
      overflow-x: auto;
      margin-bottom: 1rem;
    }

    .main-content pre code {
      background: none;
      padding: 0;
    }

    /* Footer */
    .site-footer {
      background: #f9f9f9;
      padding: 2rem 0;
      text-align: center;
      color: #666;
      font-size: 0.85rem;
      margin-top: 3rem;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .main-content {
        padding: 2rem 2rem;
      }

      .header-content {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
        padding: 0 1.5rem;
      }

      .header-right {
        align-items: flex-start;
        width: 100%;
      }

      .workshop-nav {
        width: 100%;
        flex-wrap: wrap;
        gap: 1rem;
        margin-top: 0.5rem;
      }

      .site-title {
        font-size: 0.9rem;
        line-height: 1.3;
      }

      .header-logos img {
        height: 30px;
      }
    }

    @media (max-width: 600px) {
      .workshop-nav {
        gap: 0.75rem;
      }

      .workshop-nav a {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      <a href="{{ '/' | relative_url }}" class="site-title">
        <span class="title-acronym">PEBBLE</span><span class="title-eq">=</span><span class="cap">P</span>hysics<span class="op">+</span><span class="cap">E</span>ngineering<span class="op">+</span><span class="cap">B</span>iology<span class="op">+</span><span class="cap">B</span>iotechnology<span class="op">+</span><span class="cap">L</span>earning<span class="op">+</span><span class="cap">E</span>xperience
      </a>
      <div class="header-right">
        <div class="header-logos">
          <a href="https://cis.westlake.edu.cn/index.htm" target="_blank" rel="noopener" title="CIS, Westlake University">
            <img src="{{ '/images/cis-logo.png' | relative_url }}" alt="CIS, Westlake University">
          </a>
          <a href="https://www.westlake.edu.cn/" target="_blank" rel="noopener" title="Westlake University">
            <img src="{{ '/images/westlake-logo.png' | relative_url }}" alt="Westlake University">
          </a>
        </div>
        <nav class="workshop-nav">
          <a href="{{ '/workshop/ignition/' | relative_url }}">Ignition</a>
          <a href="{{ '/workshop/synthesis/' | relative_url }}">Synthesis</a>
          <a href="{{ '/workshop/gallery/' | relative_url }}">Gallery</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    &copy; 2026 PEBBLE BioFusion Workshop, Westlake University CIS
  </footer>
</body>
</html>
