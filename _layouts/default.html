<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}"/>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background: #fff;
      font-size: 16px;
    }

    /* Header */
    .site-header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 1.5rem 0;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .site-title {
      font-size: 1.15rem;
      font-weight: 400;
      color: #555;
      text-decoration: none;
      display: inline-flex;
      align-items: baseline;
      flex-wrap: wrap;
      line-height: 1.4;
    }

    .site-title:hover {
      color: #0066cc;
    }

    .site-title .title-acronym {
      font-weight: 700;
      color: #FF6C0C;
      margin-right: 0.3rem;
      white-space: nowrap;
    }

    .site-title .title-eq {
      margin: 0 0.3rem;
      font-weight: 400;
    }

    .site-title .cap {
      font-weight: 700;
      color: #FF6C0C;
    }

    .site-title .op {
      margin: 0 0.5rem;
      font-weight: 400;
      color: #555;
    }

    .header-nav {
      display: flex;
      gap: 1.5rem;
    }

    .header-nav a {
      color: #555;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .header-nav a:hover {
      color: #0066cc;
    }

    /* Main Layout */
    .main-wrapper {
      display: flex;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      padding: 2rem 1.5rem 2rem 2rem;
      border-right: 1px solid #e0e0e0;
      flex-shrink: 0;
    }

    .sidebar-section {
      margin-bottom: 2rem;
    }

    .sidebar-title {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #1f2937;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #d1d5db;
    }

    .sidebar-nav {
      list-style: none;
    }

    .sidebar-nav li {
      margin-bottom: 0.5rem;
    }

    .sidebar-nav a {
      color: #333;
      text-decoration: none;
      font-size: 0.9rem;
      display: block;
      padding: 0.25rem 0;
      transition: color 0.2s;
    }

    .sidebar-nav a:hover {
      color: #0066cc;
    }

    .sidebar-nav a.active {
      color: #0066cc;
      font-weight: 500;
    }

    /* Workshop Tree */
    .workshop-tree {
      margin-top: 0.5rem;
    }

    .workshop-year-label {
      font-size: 0.95rem;
      font-weight: 500;
      color: #6b7280;
      margin-bottom: 0.75rem;
      letter-spacing: 1px;
    }

    .workshop-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: none;
      border: none;
      padding: 0.35rem 0;
      margin-bottom: 0.5rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      color: #6b7280;
      cursor: pointer;
      letter-spacing: 1px;
      transition: color 0.2s;
    }

    .workshop-toggle:hover {
      color: #FF6C0C;
    }

    .workshop-toggle:hover .toggle-arrow {
      color: #FF6C0C;
    }

    .toggle-arrow {
      display: inline-block;
      font-size: 0.65rem;
      color: #9ca3af;
      transition: transform 0.2s, color 0.2s;
    }

    .workshop-toggle[aria-expanded="true"] .toggle-arrow {
      transform: rotate(90deg);
      color: #FF6C0C;
    }

    .workshop-nav {
      list-style: none;
      padding-left: 0.75rem;
      border-left: 2px solid #e0e0e0;
      margin: 0 0 0 0.25rem;
    }

    .workshop-nav.collapsed {
      display: none;
    }

    .workshop-nav li {
      margin-bottom: 0.3rem;
    }

    .workshop-nav a {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: #1f2937;
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.35rem 0;
      transition: color 0.2s, transform 0.2s;
    }

    .workshop-nav a:hover {
      color: #FF6C0C;
      transform: translateX(4px);
    }

    .workshop-marker {
      width: 6px;
      height: 6px;
      background: #1f2937;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .workshop-nav a:hover .workshop-marker {
      background: #FF6C0C;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 2rem 3rem;
      min-width: 0;
      max-width: 900px;
    }

    .main-content h1 {
      font-size: 1.8rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      color: #333;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 1rem;
    }

    .main-content h2 {
      font-size: 1.4rem;
      font-weight: 500;
      margin-top: 2rem;
      margin-bottom: 1rem;
      color: #333;
    }

    .main-content h3 {
      font-size: 1.1rem;
      font-weight: 500;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      color: #444;
    }

    .main-content p {
      margin-bottom: 1rem;
      color: #333;
    }

    .main-content ul, .main-content ol {
      margin-bottom: 1rem;
      padding-left: 1.5rem;
    }

    .main-content li {
      margin-bottom: 0.5rem;
    }

    .main-content a {
      color: #0066cc;
      text-decoration: none;
    }

    .main-content a:hover {
      text-decoration: underline;
    }

    .main-content code {
      background: #f4f4f4;
      padding: 0.2rem 0.4rem;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
    }

    .main-content pre {
      background: #f4f4f4;
      padding: 1rem;
      border-radius: 4px;
      overflow-x: auto;
      margin-bottom: 1rem;
    }

    .main-content pre code {
      background: none;
      padding: 0;
    }

    /* Footer */
    .site-footer {
      background: #f9f9f9;
      border-top: 1px solid #e0e0e0;
      padding: 2rem 0;
      text-align: center;
      color: #666;
      font-size: 0.85rem;
      margin-top: 3rem;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .main-wrapper {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #e0e0e0;
        padding: 1.5rem 2rem;
      }

      .main-content {
        padding: 2rem 2rem;
      }

      .header-nav {
        display: none;
      }

      .header-content {
        padding: 0 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      <a href="{{ '/' | relative_url }}" class="site-title">
        <span class="title-acronym">PEBBLE</span><span class="title-eq">=</span><span class="cap">P</span>hysics<span class="op">+</span><span class="cap">E</span>ngineering<span class="op">+</span><span class="cap">B</span>iology<span class="op">+</span><span class="cap">B</span>iotechnology<span class="op">+</span><span class="cap">L</span>earning<span class="op">+</span><span class="cap">E</span>xperience
      </a>
    </div>
  </header>

  <div class="main-wrapper">
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">Workshop</div>
        <div class="workshop-tree">
          <button class="workshop-toggle" type="button" aria-expanded="false">
            <span class="toggle-arrow">▸</span>
            <span class="toggle-label">2026</span>
          </button>
          <ul class="workshop-nav collapsed">
            <li>
              <a href="{{ '/years/2026/' | relative_url }}">
                <span class="workshop-marker"></span>
                ignition
              </a>
            </li>
            <li>
              <a href="{{ '/years/2026/' | relative_url }}">
                <span class="workshop-marker"></span>
                synthesis
              </a>
            </li>
          </ul>
        </div>
      </div>
    </aside>

    <main class="main-content">
      {{ content }}
    </main>
  </div>

  <footer class="site-footer">
    &copy; 2026 Pebble Biofusion Summer School, Westlake University CIS
  </footer>

  <script>
    document.querySelectorAll('.workshop-toggle').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var expanded = this.getAttribute('aria-expanded') === 'true';
        this.setAttribute('aria-expanded', !expanded);
        var nav = this.nextElementSibling;
        if (nav) {
          nav.classList.toggle('collapsed');
        }
      });
    });
  </script>
</body>
</html>
